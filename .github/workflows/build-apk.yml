name: Build APK

# Every push to any branch builds (the run shows up on the branch's pull request too), tags
# publish releases, and the workflow can be started by hand. There is no separate
# pull_request trigger on purpose: it would run the exact same build a second time.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to a feature branch cancels the older build; a main build is never cancelled,
# so the "latest" tag and its APK are always published together.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key instead of the committed keystore/calc.jks.
      # Create the repository secrets CALC_KEYSTORE_B64 (base64 of your .jks/.p12),
      # CALC_KEYSTORE_PASSWORD, CALC_KEY_ALIAS and CALC_KEY_PASSWORD; empty secrets are ignored.
      - name: Prepare custom signing key (only if the secret exists)
        env:
          CALC_KEYSTORE_B64: ${{ secrets.CALC_KEYSTORE_B64 }}
        run: |
          if [ -n "$CALC_KEYSTORE_B64" ]; then
            echo "$CALC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/custom-signing.jks"
            echo "CALC_KEYSTORE_FILE=$RUNNER_TEMP/custom-signing.jks" >> "$GITHUB_ENV"
            echo "Using the custom signing key from secrets."
          else
            echo "No CALC_KEYSTORE_B64 secret: signing with keystore/calc.jks."
          fi

      - name: Run unit tests and build release APK
        env:
          CALC_KEYSTORE_PASSWORD: ${{ secrets.CALC_KEYSTORE_PASSWORD }}
          CALC_KEY_ALIAS: ${{ secrets.CALC_KEY_ALIAS }}
          CALC_KEY_PASSWORD: ${{ secrets.CALC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testReleaseUnitTest assembleRelease bundleRelease

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testReleaseUnitTest
          if-no-files-found: ignore

      - name: Collect APK and AAB
        run: |
          cp app/build/outputs/apk/release/app-release.apk Calc.apk
          cp app/build/outputs/bundle/release/app-release.aab Calc.aab
          ls -la Calc.apk Calc.aab

      # Every run keeps the APK as a downloadable artifact (Actions tab -> run -> Artifacts).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calc-apk
          path: Calc.apk
          if-no-files-found: error

      # The Android App Bundle is what Google Play accepts (upload it in Play Console).
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calc-aab
          path: Calc.aab
          if-no-files-found: error

      # Pushes to main publish a rolling "latest" pre-release with a stable download URL:
      # https://github.com/<owner>/<repo>/releases/download/latest/Calc.apk
      - name: Move "latest" tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish rolling "latest" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: true
          files: |
            Calc.apk
            Calc.aab
          body: |
            Build automático do último commit em `main` (`${{ github.sha }}`).
            Baixe `Calc.apk`, instale no Android (permita "fontes desconhecidas") e pronto.

      # Tags like v1.0 publish a proper versioned release.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Calc.apk
            Calc.aab
          generate_release_notes: true
